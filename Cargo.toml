[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
# Placeholders until the public repository location is decided.
repository = "https://github.com/tpt-solutions/tpt-search"

[workspace.lints.rust]
# Forbidden workspace-wide. Only tpt-search-vector and tpt-search-storage carry
# an explicit `#![allow(unsafe_code)]` (SIMD intrinsics and memmap2 respectively).
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
