[package]
name = "tpt-search-capi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ffi", "c-api", "json", "bindings", "cdylib"]
categories = ["development-tools::ffi", "api-bindings"]
description = "C ABI for tpt-search: a plain extern \"C\" surface with a hand-written header"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.154"
tpt-search-api = { version = "0.1.0", path = "../tpt-search-api" }
tpt-search-core = { version = "0.1.0", path = "../tpt-search-core" }
tpt-search-index = { version = "0.1.0", path = "../tpt-search-index" }
tpt-search-query = { version = "0.1.0", path = "../tpt-search-query" }

# The FFI boundary is the one place that needs `unsafe`. cbindgen is avoided on purpose
# because its MPL-2.0 build dependencies fail deny.toml, so the header is written by hand.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
