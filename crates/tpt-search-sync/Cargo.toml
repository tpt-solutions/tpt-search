[package]
name = "tpt-search-sync"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Edge-to-cloud sync for tpt-search: CRDTs, offline-queued delta sync, and bandwidth planning"
keywords = ["crdt", "sync", "offline-first", "edge", "delta-sync"]
categories = ["database-implementations", "network-programming"]

[dependencies]
flate2 = "1.1.11"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tpt-search-core = { version = "0.1.0", path = "../tpt-search-core" }
tpt-search-storage = { version = "0.1.0", path = "../tpt-search-storage" }

[lints]
workspace = true
