[package]
name = "tpt-search-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Persistence for tpt-search: checksummed write-ahead log, mmap segments, and snapshots"
keywords = ["write-ahead-log", "persistence", "mmap", "snapshot", "segments"]
categories = ["database-implementations", "filesystem"]

[dependencies]
crc32fast = "1.5.5"
memmap2 = "0.9.12"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tpt-search-core = { version = "0.1.0", path = "../tpt-search-core" }
tpt-search-index = { version = "0.1.0", path = "../tpt-search-index" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3.27.0"

[[bench]]
name = "storage_bench"
harness = false
