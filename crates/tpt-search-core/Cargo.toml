[package]
name = "tpt-search-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core types for tpt-search: documents, schemas, text analysis, errors, and runtime helpers"
keywords = ["search", "text-analysis", "tokenizer", "stemming", "full-text"]
categories = ["database-implementations", "text-processing"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
